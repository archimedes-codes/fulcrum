[package]
name = "fulcrum-core"
version = "0.11.0"
edition = "2021"
description = "The Fulcrum agent engine core — extracted from archimedes (T5-T8)"

# S8b.1 — the crate's OWN fixture binaries, so `cargo test` inside this package
# (including a copy of it standing alone, which is the T8b condition) builds the
# two process fixtures it spawns instead of reaching for bins owned by the
# desktop package.
#
# Declared explicitly rather than left to `src/bin/` auto-discovery for two
# reasons: the name is the whole design (`_core` — see below and
# `src/fixtures/mod.rs` for the measured cargo#6313 output-filename collision
# this avoids) and an explicit `[[bin]]` documents that these are fixtures, not
# shipped executables. They are NOT feature-gated: a gated bin is not built
# unless someone turns the feature on, and turning it on from the desktop's
# normal dependency list would ship fixture code into the app anyway.
#
# The NAMES MUST NOT COLLIDE with the desktop's `fake_worker` /
# `fake_mcp_stdio` bins, and the desktop's MUST keep their unsuffixed names
# forever: `CARGO_BIN_EXE_<name>` is package-local, so the desktop's 7
# integration tests can only resolve a bin of its own.
[[bin]]
name = "fake_worker_core"
path = "src/bin/fake_worker_core.rs"

[[bin]]
name = "fake_mcp_stdio_core"
path = "src/bin/fake_mcp_stdio_core.rs"

# The dependencies the crate's sources actually name — nothing else. Adding a
# dependency the crate does not use is a silent widening of what the engine is
# allowed to reach for, so each line below is justified by a `grep`-able use in
# `src/`, and `tauri` / `tauri_plugin_*` / `archimedes_lib` / `rusqlite` are
# deliberately ABSENT (the crate compiling without them is the master roadmap's
# decoupling criterion; `rusqlite` stays out because `DbError` cannot move —
# Step B-bis).
[dependencies]
# `events.rs` (`RpcEvent`/`CompactionReason` derive), `ids.rs`, `todo.rs`,
# `fs_backend.rs` (`FsError`'s serde tag), `boundary.rs`, `policy.rs`,
# `skills.rs`/`agents.rs` (`SkillInfo`/`AgentDefinition` derive),
# `web/config.rs` (`WebSettings`' serde — the DTO T5/S2 moved per plan §2c),
# `web/providers/*` (the provider wire DTOs).
serde = { version = "1", features = ["derive"] }
# `events.rs` (`Value` is the event payload type), `ids.rs` + `todo.rs` (tests),
# `tools/exec/*` (tool params/results are `serde_json::Value`),
# `web/providers/*` (provider JSON), `harness`-adjacent tool specs.
serde_json = "1"
# `types.rs` + `ids.rs` (`mint_session_id`/`SessionId::mint`), `fs_backend.rs`
# (tests), `test_support.rs` (the scratch-dir uuid), `tools/sandbox` +
# `tools/exec/tests` (fixture dir names), `roots.rs` (tests).
uuid = { version = "1", features = ["v4"] }
# `debuglog.rs:50` (`dirs::data_dir()` — the supervisor log's base dir),
# `skills.rs`/`agents.rs`/`roots.rs` (`home_dir()` — the harness's OWN
# `$HOME/.agents` root, NOT the desktop's `settings.json`; T3's invariant is
# about the desktop config file and this is a different config root). T7/S7.1
# adds two more, both the SAME kind of platform dir and NEITHER the desktop
# settings file: `provider_auth/store.rs:153` (`data_dir()` — the
# `provider-auth.json` path, ruling R3) and `provider_auth/gcloud.rs:130`
# (`home_dir()` — the Google ADC file, read-only).
dirs = "6"
# `fs_backend.rs:28` (`FsError`'s `thiserror::Error` derive),
# `web/net.rs` (`NetError`'s `#[from] reqwest::Error`).
thiserror = "2"
# The engine spawns and confines children: `tools/exec/bash.rs` + `search.rs`
# (`fd`/`rg`), `childproc.rs` (the one `Command` constructor),
# `hostenv.rs` (`EnvPatch::apply` takes a `tokio::process::Command`),
# `web/net.rs` (`tokio::net::TcpStream` for the DNS-rebind-safe connect),
# `tools/exec/tests/bash.rs` (`tokio::runtime::Builder`). Feature set mirrors the
# desktop's so feature unification keeps ONE copy of `tokio` in the graph.
tokio = { version = "1", features = [
    "process",
    "io-util",
    "io-std",
    "sync",
    "macros",
    "time",
    "net",
    "rt",
] }
# `tools/types.rs` (`CancellationToken` on `ToolCtx`), `web/net.rs`,
# `web/tools.rs` — the cancel handle every tool call carries. T7/S7.1 adds the
# two OAuth flows' cancel handle (`provider_auth/litellm_oauth.rs:40`,
# `provider_auth/oidc.rs:39`), which the desktop used to be the only holder of.
tokio-util = "0.7"
# The `exec_find` fallback when `fd` is not installed (walk the cwd tree):
# `tools/exec/search.rs`.
walkdir = "2"
# base64 for the `read` tool's image content blocks (`tools/exec/fs_tools.rs`):
# pi's `ImageContent` = `{type:"image", data, mimeType}`, `data` is base64.
# T7/S7.1 adds two more justifications: the OAuth/OIDC PKCE encoders
# (`provider_auth/litellm_oauth.rs`, `provider_auth/oidc.rs`) base64url-encode
# the challenge and the random `state`/`nonce` with `URL_SAFE_NO_PAD`, and
# `provider_auth/cli_sso.rs` base64url-DECODES a JWT payload to read its `exp`.
base64 = "0.22"
# The web subsystem's HTTP client (`web/net.rs`, `web/providers/*`). Same
# feature choices as the desktop, for the same reason: `rustls-tls` with default
# features OFF avoids a system-OpenSSL build dependency (and keeps `openssl-sys`
# out of a crate meant to build anywhere), `stream` provides the `bytes_stream`
# `web/net.rs:336` consumes, `json` the request bodies. T7/S7.1 adds the token
# exchanges (`provider_auth/gcloud.rs`'s ADC refresh POST,
# `provider_auth/oidc.rs`'s + `provider_auth/litellm_oauth.rs`'s token and
# discovery requests) and `resolve_bearer_at`'s `&reqwest::Client` parameter —
# all crate-side, none of them reading a file.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
# `url` — the web subsystem parses URLs for the SSRF checks (`web/net.rs`), the
# extractors (`web/extract/*`) and the providers (`web/providers/*`). T7/S7.1
# adds `provider_auth/litellm_oauth.rs:144` (validating a `base_url` before a
# gateway header can attach to it) and `provider_auth/gcloud.rs`'s
# `form_urlencoded` parse of the captured token POST (a test-side assertion).
url = "2"
# `BoxStream`/`StreamExt` for the streaming body reads (`web/net.rs:1`,
# `web/providers/registry.rs:203` `try_join_all`).
futures-util = "0.3"
# The `#[async_trait]` on the Search provider trait and its six implementations
# (`web/providers/*`).
async-trait = "0.1"
# The HTML→markdown pipeline: `web/extract/article.rs`,
# `web/providers/duckduckgo.rs`.
dom_query = "0.28"
# DuckDuckGo's own client (`web/providers/duckduckgo.rs`) — one of the five
# Search providers, so it is engine functionality, not a desktop extra.
ddgs = "0.1"
# PDF body extraction (`web/extract/pdf.rs`).
pdf-extract = "0.12"
# `web/extract/*` (the markdown normalisers, the YouTube caption parser),
# `web/tools.rs` (the summary shaping), `web/providers/common.rs`.
regex = "1"
# The DNS-rebind IP classification in `web/net.rs` (`is_blocked_ip` over
# `IpNet` ranges).
ipnet = "2"
# The cache-bust jitter in `web/cache.rs`. T7/S7.1 adds the PKCE `verifier` and
# the OAuth `state`/`nonce` entropy (`provider_auth/oidc.rs`,
# `provider_auth/litellm_oauth.rs`) — CSRF/anti-replay randomness, not jitter.
rand = "0.9"
# The MCP OAuth 2.1 client's PKCE S256 challenge (`mcp/oauth.rs:137`,
# `sha2::Sha256::digest(verifier)`) — moved with `mcp` in T5/S3. T7/S7.1 adds the
# provider OAuth/OIDC PKCE challenge (`provider_auth/oidc.rs`,
# `provider_auth/litellm_oauth.rs`). Version matches the desktop's; note the
# desktop's own `sha2`/`rand` lines are now UNUSED by its code (measured at this
# commit: `grep -rn '\bsha2::\|\brand::' src-tauri/src` is empty) because the
# OAuth paths that needed them moved here — dropping those two manifest lines is
# a separate cleanup, deliberately NOT taken inside a move commit.
sha2 = "0.10"
# The codemode QuickJS sandbox (`codemode/engine.rs`), moved with `codemode` in
# T5/S3.
#
# FEATURES ARE LOAD-BEARING AND MUST STAY EXACTLY `futures` + `parallel`, with
# `rust-alloc` / `allocator` OFF: `set_memory_limit` is documented as a no-op
# under a custom allocator (rquickjs-core-0.14.0/src/runtime/async.rs:204-210),
# which would turn the sandbox's 256 MiB cap into a comment. `parallel` is
# required for `AsyncRuntime`/`AsyncContext` to be `Send + Sync` at all — without
# it the crate's own `Send` assertion in `engine.rs` does not compile. The whole
# history (including the measured note that the no-op is NOT reproducible on
# 0.14.0 and that the feature stays off anyway, because the guarantee we rely on
# is the one the crate PROMISES) lives in `src-tauri/Cargo.toml` above its own
# entry; the same reasoning applies verbatim here and is not re-derived.
#
# The identical feature set on BOTH members is also what keeps feature
# unification honest: `scripts/check-rquickjs-allocator.sh` resolves the ROOT
# workspace graph, so a divergent feature on this member would poison the
# desktop's cap through the workspace rather than through its own manifest.
rquickjs = { version = "0.14.0", features = ["futures", "parallel"] }

# `libc` on ALL unix, matching the desktop's own gate and for the same reason:
# `childproc.rs`'s process-group kill (`kill(-(pid as i32), SIGKILL)`) and
# `setpgid` are `#[cfg(unix)]`, not Linux-only, and `tools/sandbox.rs`'s
# `libc::stat` probe is `cfg(target_os = "linux")`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The moved `#[cfg(test)]` blocks need more than the production graph:
# `tempfile` (`roots.rs`'s walk-up fixtures), `wiremock` (the web subsystem's
# canned HTTP providers — 38 uses across `web/*` tests), and `tokio`'s
# `test-util` + `macros`/`rt` for `#[tokio::test]` (153 of them).
# Test-build features only — resolver 2 keeps this out of the desktop's graph.
[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "io-std",
    "sync",
    "macros",
    "time",
    "net",
    "rt",
    "test-util",
] }
